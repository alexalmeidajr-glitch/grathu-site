<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#1B1446" />
      <stop offset="65%" stop-color="#0F0D23" />
      <stop offset="100%" stop-color="#080614" />
    </radialGradient>

    <!-- Shaders de Cerâmica Fosca (Clay) -->
    <radialGradient id="nodeMain" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3730A3" />
    </radialGradient>

    <radialGradient id="nodeSec" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="55%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </radialGradient>

    <radialGradient id="nodeTer" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="55%" stop-color="#06D6A0" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Gradientes de Linha -->
    <linearGradient id="line12" x1="470" y1="480" x2="670" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="line13" x1="470" y1="480" x2="340" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06D6A0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filtro de Sombra Suave de Contato (Ambient Occlusion) -->
    <filter id="softContactShadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>
    <filter id="highlightBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />

  <!-- 2. Linhas de Conexão Suaves -->
  <!-- Linha 2 -> 3 (Arco sutil) -->
  <path d="M 670 330 C 630 600, 460 710, 340 680" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Linha 1 -> 2 (Principal -> Secundário) -->
  <path d="M 470 480 C 530 400, 590 370, 670 330" stroke="url(#line12)" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Linha 1 -> 3 (Principal -> Terciário) -->
  <path d="M 470 480 C 390 550, 380 590, 340 680" stroke="url(#line13)" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- 3. Órbita sutil do Super Nó -->
  <path d="M 370 390 A 180 180 0 0 1 615 570" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 8" fill="none" />
  <circle cx="615" cy="570" r="7" fill="#FBBF7A" />

  <!-- 4. Sombras de Contato Suaves dos Nós -->
  <ellipse cx="340" cy="710" rx="90" ry="32" fill="#000000" fill-opacity="0.28" filter="url(#softContactShadow)" />
  <ellipse cx="670" cy="360" rx="105" ry="38" fill="#000000" fill-opacity="0.28" filter="url(#softContactShadow)" />
  <ellipse cx="470" cy="530" rx="160" ry="55" fill="#000000" fill-opacity="0.35" filter="url(#softContactShadow)" />

  <!-- 5. Esferas Táteis (Cerâmica Fosca) -->
  <!-- Nó Terciário (Menta) -->
  <g>
    <circle cx="340" cy="680" r="80" fill="url(#nodeTer)" />
    <circle cx="315" cy="655" r="20" fill="#FFFFFF" fill-opacity="0.22" filter="url(#highlightBlur)" />
  </g>

  <!-- Nó Secundário (Lilac) -->
  <g>
    <circle cx="670" cy="330" r="95" fill="url(#nodeSec)" />
    <circle cx="640" cy="300" r="24" fill="#FFFFFF" fill-opacity="0.22" filter="url(#highlightBlur)" />
  </g>

  <!-- Nó Principal (Índigo Quente) -->
  <g>
    <circle cx="470" cy="480" r="145" fill="url(#nodeMain)" />
    <circle cx="425" cy="435" r="36" fill="#FFFFFF" fill-opacity="0.25" filter="url(#highlightBlur)" />
  </g>
</svg>
